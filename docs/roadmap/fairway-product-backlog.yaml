  - id: FW-123
    title: Add provider usage accounting telemetry model
    kind: telemetry
    role: governance
    profile: fairway-adoption
    owning_domain: fairway
    owning_layer: provider-usage
    source_paths:
      - docs/design/session-launch.md
      - docs/design/schema.md
