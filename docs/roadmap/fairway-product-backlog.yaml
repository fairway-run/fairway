  - id: FW-163
    title: Add review completion handback to coordinator plan
    kind: task
    role: backend
    profile: fairway-adoption
    owning_domain: fairway
    owning_layer: coordinator
    source_paths:
      - internal/store
      - internal/coordinator
      - cmd/fairway
