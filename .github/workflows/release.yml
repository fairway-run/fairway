name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # Pin the signing image. macos-latest moved to macOS 26 and Go 1.22 test
    # binaries abort there with dyld "missing LC_UUID" before tests execute.
    runs-on: macos-15
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      FAIRWAY_RELEASE_ASSURANCE_SIGNING_KEY: ${{ secrets.FAIRWAY_RELEASE_ASSURANCE_SIGNING_KEY }}
      FAIRWAY_RELEASE_ASSURANCE_PUBLIC_KEY: ${{ vars.FAIRWAY_RELEASE_ASSURANCE_PUBLIC_KEY }}
      FAIRWAY_RELEASE_POLICY_VERSION: sovereign-release-v1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: true
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0
      - name: Install pinned release assurance tools
        run: |
          set -euo pipefail
          go install github.com/google/go-licenses@v1.6.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Load release highlights
        run: |
          set -euo pipefail
          test -s docs/release-highlights.md
          {
            echo "FAIRWAY_RELEASE_HIGHLIGHTS<<EOF"
            cat docs/release-highlights.md
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Import macOS signing certificate
        env:
          KEYCHAIN_PASSWORD: ${{ runner.temp }}/fairway-keychain-password
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/fairway-release.keychain-db"
          p12_path="$RUNNER_TEMP/developer-id-application.p12"
          intermediate_path="$RUNNER_TEMP/developer-id-g2-ca.cer"
          printf '%s' "$MACOS_SIGN_P12" | base64 -D > "$p12_path"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$intermediate_path"
          uuidgen > "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$(cat "$KEYCHAIN_PASSWORD")" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$(cat "$KEYCHAIN_PASSWORD")" "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$MACOS_SIGN_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security import "$intermediate_path" -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$(cat "$KEYCHAIN_PASSWORD")" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" ~/Library/Keychains/login.keychain-db
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          echo "MACOS_CODESIGN_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Build the final tagged archives without creating a GitHub release or
          # mutating the Homebrew tap. Publication is gated on the signed bundle.
          args: release --clean --skip=publish
      - name: Build and verify release assurance bundle
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fairway-release-assurance"
          mkdir -p "$output"
          scripts/release/build_release_assurance_bundle.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            dist \
            "$output"
      - name: Create gated release draft from verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fairway-release-assurance"
          bundle="$output/fairway-${GITHUB_REF_NAME}-release-assurance"
          verified_archives=()
          while IFS= read -r artifact; do
            verified_archives+=("$artifact")
          done < <(find "$bundle/artifacts" -maxdepth 1 -type f -name 'fairway_*.tar.gz' -print | sort)
          goreleaser_checksums=()
          while IFS= read -r checksum; do
            goreleaser_checksums+=("$checksum")
          done < <(find dist -maxdepth 1 -type f -name 'fairway_*_checksums.txt' -print | sort)
          (( ${#verified_archives[@]} == 4 )) || {
            printf 'expected four verified release archives, found %d\n' "${#verified_archives[@]}" >&2
            exit 1
          }
          (( ${#goreleaser_checksums[@]} == 1 )) || {
            printf 'expected one GoReleaser checksum file, found %d\n' "${#goreleaser_checksums[@]}" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" \
            --repo fairway-run/fairway \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$FAIRWAY_RELEASE_HIGHLIGHTS" \
            "${verified_archives[@]}" \
            "${goreleaser_checksums[@]}" \
            "$output/fairway_${GITHUB_REF_NAME}_release_assurance.tar.gz" \
            "$output/fairway_${GITHUB_REF_NAME}_release_assurance.tar.gz.sha256"
