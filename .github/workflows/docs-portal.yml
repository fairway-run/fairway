name: Docs Portal

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: fairway-docs-portal
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'fairway-run/fairway' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FAIRWAY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FAIRWAY_CLOUDFLARE_ACCOUNT_ID }}
          FAIRWAY_PAGES_PROJECT: ${{ secrets.FAIRWAY_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FAIRWAY_PAGES_PROJECT"
          npm exec wrangler -- pages deploy build \
            --project-name "$FAIRWAY_PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME"
