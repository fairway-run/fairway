name: Rule Pack Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Fairway
        run: go install github.com/subashram/fairway/cmd/fairway@latest

      - name: Validate reusable platform pack
        run: fairway rules validate .
