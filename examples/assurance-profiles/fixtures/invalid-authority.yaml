schema: fairway.assurance-profile.v1
id: invalid-authority
version: v1
title: Invalid authority fixture
description: This fixture must fail closed because approval authority is not prohibited.
framework:
  id: customer-framework
  title: Customer Framework
  version: v1
  source: https://example.invalid/customer-framework/v1
applicability:
  description: Test only.
scope:
  types: [project]
controls:
  - id: CF-1
    title: Verification evidence
    objective: Retain bounded verification references.
    responsibility: product
    assessment_objectives: [Inspect evidence references.]
    evidence:
      - class: evidence
        minimum_count: 1
        accepted_results: [pass]
prohibited_claims: [certified, compliant, authorized]
authority:
  mode: evidence_only
  prohibited_actions: [certify, declare_compliance, accept_risk, mutate_workflow, merge, deploy, release, use_credentials, change_public_exposure, run_live_operation]
