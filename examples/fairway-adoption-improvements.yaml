tasks:
  - id: FW-101
    title: Add prompt-file session launch path
    kind: session-adapter
    role: backend
    profile: fairway-adoption
    owning_domain: fairway
    owning_layer: sessions
    source_paths:
      - docs/design/session-launch.md
      - examples/session-adapters
