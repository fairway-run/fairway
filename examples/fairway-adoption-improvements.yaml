  - id: FW-107
    title: Align dashboard ready metric with CLI readiness
    kind: dashboard
    role: ui
    profile: fairway-adoption
    owning_domain: fairway
    owning_layer: dashboard
    source_paths:
      - internal/dashboard
      - cmd/fairway/main.go
      - docs/design/dashboard.md
    target_paths:
