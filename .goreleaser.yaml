version: 2

project_name: fairway

before:
  hooks:
    - go mod tidy

builds:
  - id: fairway
    main: ./cmd/fairway
    binary: fairway
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    hooks:
      post:
        - ./scripts/release/macos_sign_notarize_binary.sh "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}"

archives:
  - id: fairway
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: "fairway_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: fairway-run
    name: fairway
  draft: true
  replace_existing_draft: true

homebrew_casks:
  - name: fairway
    ids:
      - fairway
    binaries:
      - fairway
    repository:
      owner: fairway-run
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: fairway-release-bot
      email: release@fairway.run
    commit_msg_template: "Update fairway cask to {{ .Tag }}"
    directory: Casks
    homepage: "https://fairway.run"
    description: "Coordination control plane for governed agentic engineering"
    license: "Apache-2.0"
